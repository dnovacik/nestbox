appId: dev.nestbox.app
productName: NestBox
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/brand
    to: brand
win:
  target: nsis
  icon: resources/brand/png/nestbox.ico
nsis:
  artifactName: NestBox-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/brand/png/app-icon-512.png
  category: public.app-category.developer-tools
  # Ad-hoc signature: free, and Apple Silicon refuses to run unsigned code at all. Not notarized, so the first
  # launch goes through right-click → Open (see the README).
  identity: '-'
  hardenedRuntime: false
  artifactName: NestBox-${version}-${arch}.${ext}
dmg:
  artifactName: NestBox-${version}-${arch}.${ext}
