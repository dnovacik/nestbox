name: Release

# Builds the Windows installer and the macOS DMGs (arm64, x64), then attaches them all to one draft GitHub
# Release. Push a tag like v1.1.0 (matching package.json's version), then review and publish the draft on
# GitHub. A manual run builds the commit it is started on and drafts a release for v<package.json version>
# at that commit (publishing it creates the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows installer
            builder: --win
            files: release/*/NestBox-Setup-*.exe
          - os: macos-latest
            name: macOS DMGs
            builder: --mac
            files: release/*/NestBox-*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      # One job creates the draft with every file: two jobs racing could each create their own draft.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          # upload-artifact keeps the folders after the first wildcard (release/<version>/), so match at any depth.
          files: installers/**/NestBox-*
          fail_on_unmatched_files: true
