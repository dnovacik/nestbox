name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # No ELECTRON_SKIP_BINARY_DOWNLOAD here: the end-to-end tests need the Electron binary.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  package:
    name: package (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # An unpacked build (no installer): enough to prove the packaged app loads and answers IPC.
      - run: pnpm exec electron-builder --win --dir --publish never
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter NestBox.exe | Where-Object { $_.FullName -like '*win-unpacked*' } | Select-Object -First 1
          if (-not $exe) { throw 'NestBox.exe not found under release/' }
          $env:NESTBOX_PACKAGED_EXE = $exe.FullName
          pnpm exec playwright test -c e2e/playwright.config.ts packaged.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-traces
          path: test-results/
