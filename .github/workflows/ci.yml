name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # No ELECTRON_SKIP_BINARY_DOWNLOAD here: the end-to-end tests need the Electron binary.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/

  package:
    name: package (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # An unpacked build (no installer or DMG): enough to prove the packaged app loads and answers IPC.
      - if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --dir --publish never
      - if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac --dir --arm64 --publish never
      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter NestBox.exe | Where-Object { $_.FullName -like '*win-unpacked*' } | Select-Object -First 1
          if (-not $exe) { throw 'NestBox.exe not found under release/' }
          $env:NESTBOX_PACKAGED_EXE = $exe.FullName
          pnpm exec playwright test -c e2e/playwright.config.ts packaged.spec.ts
      - name: Smoke test the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          exe=$(find release -path '*mac-arm64/NestBox.app/Contents/MacOS/NestBox' -type f | head -1)
          if [ -z "$exe" ]; then echo 'NestBox.app not found under release/'; exit 1; fi
          NESTBOX_PACKAGED_EXE="$PWD/$exe" pnpm exec playwright test -c e2e/playwright.config.ts packaged.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-traces-${{ matrix.os }}
          path: test-results/
